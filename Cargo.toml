[package]
name = "riftpdf"
version = "0.1.0"
edition = "2021"
description = "Lightweight Zathura-inspired PDF viewer for macOS"
license = "AGPL-3.0-only"
repository = "https://github.com/aquinoonell/riftpdf"

[dependencies]
mupdf = { version = "0.8", default-features = false, features = ["base14-fonts"] }
winit = "0.30"
softbuffer = "0.4"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
