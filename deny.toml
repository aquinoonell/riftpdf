# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "warn"
ignore = [
    # Transitive via winit → sctk-adwaita → ab_glyph; no upgrade path yet.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; pulled in by winit on Wayland backends" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    # Project + MuPDF bindings (crates still emit deprecated AGPL-3.0 id)
    "AGPL-3.0",
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
]

exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
